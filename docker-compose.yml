# Civil Buddy packing engine (gateway)
# usage: CIVIL_TOKEN=<长随机串> docker compose up --build
# open:  http://localhost:8000/?token=<口令>（只需一次，之后是 HttpOnly cookie）
# 服务器上前面有 Caddy/nginx 做 HTTPS 时，把端口改成 "127.0.0.1:8000:8000"，只放行 80/443
services:
  gateway:
    build: .
    image: civil-buddy-gateway:0.6.4
    ports:
      - "8000:8000"
    environment:
      - CIVIL_TOKEN=${CIVIL_TOKEN:?请先设置 CIVIL_TOKEN（访问口令）}
      - SKJOLBER_URL=${SKJOLBER_URL:-}
      - PACKING_OTEL=${PACKING_OTEL:-0}
      - PACKING_LANGFUSE=${PACKING_LANGFUSE:-0}
      - PACKING_OUTPUT_DIR=/app/output
      - PACKING_TRACE_DIR=/app/output/traces
    volumes:
      - packing_output:/app/output
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  packing_output:
