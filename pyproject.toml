# Civil Buddy is run from its source tree: the package reads workbench/seed.json, .agents/skills and
# knowledge_base/ beside it. `pip install -e .` gives the `civil` command; a wheel would not carry those
# folders and is not what this file is for.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civil-buddy"
version = "0.7.0"
description = "Agent workbench for civil / construction / tendering work: deterministic tools compute, a human confirms."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "typing-extensions>=4.8.0",
    "matplotlib>=3.8.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1.0",
    "pypdf>=5.0",
]

[project.optional-dependencies]
# Scanned tenders and certificates: pages are rendered with pdfium and read by RapidOCR (ONNX models shipped in
# the wheel, no network at run time). Both Apache-2.0 / BSD. Without them a scan is reported as not read.
ocr = ["rapidocr-onnxruntime>=1.3.24", "pypdfium2>=4.30.0"]

[project.scripts]
civil = "packing_assistant.civil:main"

[tool.setuptools.packages.find]
include = ["packing_assistant*"]
