[package]
name = "pack-core"
version = "0.1.0"
edition = "2021"
description = "Packing-list parse + N0* booking lower bound (tools compute)"
license = "MIT"

[dependencies]
calamine = "0.26"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "pack-inspect"
path = "src/bin/pack-inspect.rs"
